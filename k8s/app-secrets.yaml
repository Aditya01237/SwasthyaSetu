apiVersion: v1
kind: Secret
metadata:
  name: swasthya-secrets
type: Opaque
stringData:
  postgres-user: myuser
  postgres-password: myuser
  rabbitmq-user: guest
  rabbitmq-password: guest
  jwt-secret: change-me-to-at-least-32-characters
  internal-service-token: change-me-to-a-random-internal-service-token
  # Bootstrap ADMIN is created only when both values are set. Keep empty in source control.
  bootstrap-admin-email: ""
  bootstrap-admin-password: ""
  # Set locally for Minikube; do not commit real values. App Password: https://support.google.com/accounts/answer/185833
  spring-mail-username: ""
  spring-mail-password: ""
